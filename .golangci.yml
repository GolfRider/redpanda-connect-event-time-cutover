version: "2"
linters:
  enable: [funlen, gocognit, nestif, dupl, errorlint, revive]
  settings:
    funlen: { lines: 60, statements: 40 }
    gocognit: { min-complexity: 15 }
    errcheck: { exclude-functions: [fmt.Fprint, fmt.Fprintf, fmt.Fprintln] } # terminal output: a failed write has no useful handling
formatters:
  enable: [gofmt, goimports]